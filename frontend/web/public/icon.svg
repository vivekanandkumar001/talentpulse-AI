<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="pgLiveBg" x1="6" y1="4" x2="42" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2f6bff"/>
      <stop offset="0.55" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#0b1f3f"/>
    </linearGradient>
    <linearGradient id="pgLiveDot" x1="31" y1="29.5" x2="40.5" y2="39.5" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <!-- Rounded squircle tile -->
  <rect x="2" y="2" width="44" height="44" rx="11" fill="url(#pgLiveBg)"/>

  <!-- Bowl of the "p" (open-right ring, reads as the glyph counter) -->
  <circle cx="27" cy="18.6" r="7.4" stroke="#ffffff" stroke-width="5.4" fill="none"/>

  <!-- Stem of the "p" (full-height descender on the left) -->
  <rect x="13.4" y="11.2" width="6.6" height="25.8" rx="3.3" fill="#ffffff"/>

  <!-- ".live" cyan dot + halo, like a live-signal blip -->
  <circle cx="36.2" cy="34.8" r="6.9" fill="#22d3ee" opacity="0.22"/>
  <circle cx="36.2" cy="34.8" r="4.5" fill="url(#pgLiveDot)"/>
</svg>
